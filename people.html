<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar">
    <img id="company-logo" src="./src/company-logo.svg" alt="Construction Company">
    <ul id="nav-buttons">
      <li><span class="material-icons-round">apartment</span>Projects</li>
      <li><span class="material-icons-round">people</span>Users</li>
    </ul>
  </aside>
  <main id="content">
    <div class="page" id="people-page" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
      <style>
        table {
          border-collapse: collapse;
          width: 100%;
          table-layout: auto;
        }
        th, td {
          border: 1px solid #dddddd8f;
          padding: 10px;
          text-align: left;
        }
        th {
          background-color: #f0f0f0a4;
        }
        
      </style>
      <table>
        <tr>
          <th>Nombre</th>
          <th>Empresa</th>
          <th>Puesto</th>
        </tr>
        <tr>
          <td>Juan Pérez</td>
          <td>Google</td>
          <td>Ingeniero de Software</td>
        </tr>
        <tr>
          <td>Maria García</td>
          <td>Microsoft</td>
          <td>Diseñadora de Experiencia de Usuario</td>
        </tr>
        <tr>
          <td>Pedro Rodríguez</td>
          <td>Amazon</td>
          <td>Gerente de Proyectos</td>
        </tr>
        <tr>
          <td>Juan Hoyos</td>
          <td>That Open Company</td>
          <td>Desarrollo de Software</td>
        </tr>
      </table>
    </div>
  </main>
</body>
</html>
